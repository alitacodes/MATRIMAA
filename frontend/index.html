<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Zalando+Sans:ital,wght@0,200..900;1,200..900&display=swap"
      rel="stylesheet"
    />
    <title>Matrimaa</title>
  </head>
  <body>
    <div id="main-bg">
      <div id="navbar">
        <img src="matrimaa-logo.png" alt="Matrimaa Logo" />
        <div id="nav-buttons">
          <button>HOME</button>
          <button>JOURNEY</button>
          <button>ABOUT US</button>
          <button>JOIN US</button>
        </div>
        <div class="spl-btn">
          <button>PARTNER WITH US</button>
        </div>
      </div>

      <img
        src="Flower.png"
        class="bg-flower flower-left"
        alt="Decorative Flower"
      />
      <img
        src="Flower.png"
        class="bg-flower flower-right"
        alt="Decorative Flower"
      />
      <!-- Single Petals -->
      <img src="single-petal.png" class="bg-petal petal-bl-1" alt="Petal" />
      <img src="single-petal.png" class="bg-petal petal-bl-2" alt="Petal" />
      <img src="single-petal.png" class="bg-petal petal-tr-1" alt="Petal" />
      <img src="single-petal.png" class="bg-petal petal-tr-2" alt="Petal" />
      <div id="body-txt">
        <h1>A TRIBUTE TO</h1>
        <h1>OUR ORIGIN</h1>
      </div>
      <div class="crown-float-wrapper">
        <img src="big-crown.png" class="big-crown-img" alt="" />
      </div>

      <img src="Ellipse 9.png" class="podium-shadow" alt="" />

      <div class="spl-btn-2">
        <button>START YOUR JOURNEY</button>
      </div>
    </div>

    <!-- Red Spotlight Background Section -->
    <div id="red-bg">
      <!-- Glassmorphic Cards -->
      <div class="card card-top-left">
        <h4>STARTED</h4>
        <h2>2022</h2>
      </div>

      <div class="card card-top-right">
        <h4>MENTOR</h4>
        <h2>TUHINAA PANDEY</h2>
      </div>

      <div class="card card-bottom-left">
        <h4>
          <strong>5 SEASONS</strong><br />
          OF CELEBRATING<br />
          MOTHERHOOD
        </h4>
      </div>

      <div class="card card-bottom-right">
        <h4>ORIGIN</h4>
        <h2>KOLKATA</h2>
      </div>

      <!-- Center Silhouette & Crown Container -->
      <div class="model-wrapper">
        <img src="small-crown.png" class="head-crown" alt="Crown" />
        <img
          src="woman-silhoutte.png"
          class="model-img"
          alt="Model Silhouette"
        />
      </div>
    </div>

    <!-- Dark Stats Section -->
    <div id="stats-section">
      <div class="stats-container">
        <div class="stat-item">
          <h2>5+</h2>
          <p>SEASONS</p>
        </div>
        <div class="stat-item">
          <h2>100+</h2>
          <p>PARTICIPANTS</p>
        </div>
        <div class="stat-item">
          <h2>20+</h2>
          <p>PARTNERS</p>
        </div>
      </div>
      <p class="stats-tagline">CELEBRATING WOMEN, CREATING IMPACT</p>
    </div>

    <script>
      const headCrown = document.querySelector(".head-crown");
      let isCrowned = false;

      window.addEventListener("scroll", () => {
        // Triggers permanent crown when scrolled down to landing point
        if (!isCrowned && window.scrollY > 280) {
          headCrown.classList.add("is-crowned");
          isCrowned = true;
        }
      });
    </script>
  </body>
</html>
