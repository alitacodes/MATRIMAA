<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Zalando+Sans:ital,wght@0,200..900;1,200..900&display=swap"
      rel="stylesheet"
    />
    <title>Matrimaa</title>
  </head>
  <body>
    <div id="main-bg">
      <div id="navbar">
        <img src="matrimaa-logo.png" alt="Matrimaa Logo" />
        <div id="nav-buttons">
          <button>Home</button>
          <button>Journey</button>
          <button>About Us</button>
          <button>Join Us</button>
        </div>
        <div class="spl-btn">
          <button>Partner with us</button>
        </div>
      </div>

      <div id="body-txt">
        <h1>A TRIBUTE TO</h1>
        <h1>OUR ORIGIN</h1>
      </div>
      <img src="big-crown.png" class="big-crown-img" alt="" />
      <img src="Ellipse 9.png" class="podium-shadow" alt="" />

      <div class="spl-btn-2">
        <button>Start your journey</button>
      </div>
    </div>

    <!-- Red Spotlight Background Section -->
    <div id="red-bg">
      <!-- Glassmorphic Cards -->
      <div class="card card-top-left">
        <h4>STARTED</h4>
        <h2>2022</h2>
      </div>

      <div class="card card-top-right">
        <h4>MENTOR</h4>
        <h2>TUHINAA PANDEY</h2>
      </div>

      <div class="card card-bottom-left">
        <h4>
          <strong>5 SEASONS</strong><br />
          OF CELEBRATING<br />
          MOTHERHOOD
        </h4>
      </div>

      <div class="card card-bottom-right">
        <h4>ORIGIN</h4>
        <h2>KOLKATA</h2>
      </div>

      <!-- Center Silhouette & Crown Container -->
      <div class="model-wrapper">
        <img src="small-crown.png" class="head-crown" alt="Crown" />
        <img
          src="woman-silhoutte.png"
          class="model-img"
          alt="Model Silhouette"
        />
      </div>
    </div>
  </body>
</html>
